<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background transparent -->

  <!-- Back photo (rose pastel) -->
  <g transform="rotate(8 350 200)">
    <rect x="220" y="60" width="220" height="300" rx="28"
          fill="#FFB7D5" stroke="#2B2B2B" stroke-width="8"/>
    
    <!-- Inner photo area -->
    <rect x="245" y="95" width="170" height="200" rx="20"
          fill="#F4F4F4" stroke="#2B2B2B" stroke-width="6"/>

    <!-- Mountains -->
    <path d="M250 250 Q290 200 330 250 T410 250 V295 H250 Z"
          fill="#6D6A9F"/>

    <!-- Sun -->
    <circle cx="370" cy="140" r="18" fill="#FFD6A5"/>

    <!-- Birds -->
    <path d="M295 140 q10 -10 20 0" stroke="#2B2B2B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M325 155 q10 -10 20 0" stroke="#2B2B2B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Front photo (bleu pastel) -->
  <g transform="rotate(-6 200 300)">
    <rect x="60" y="150" width="240" height="310" rx="28"
          fill="#AFCBFF" stroke="#2B2B2B" stroke-width="8"/>
    
    <!-- Inner photo area -->
    <rect x="90" y="185" width="190" height="210" rx="20"
          fill="#F4F4F4" stroke="#2B2B2B" stroke-width="6"/>

    <!-- Mountains -->
    <path d="M100 350 Q150 280 200 350 T280 350 V395 H100 Z"
          fill="#5F5C8D"/>

    <!-- Sun -->
    <circle cx="230" cy="230" r="18" fill="#FFD6A5"/>

    <!-- Birds -->
    <path d="M145 230 q10 -10 20 0" stroke="#2B2B2B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M175 250 q10 -10 20 0" stroke="#2B2B2B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Decorative sparkles -->
  <circle cx="90" cy="80" r="10" fill="#B8F2E6"/>
  <polygon points="420,420 430,440 450,440 435,455 440,475 420,460 400,475 405,455 390,440 410,440"
           fill="#CDB4DB"/>

</svg>
